<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" role="img" aria-label="Adam — Software Engineering">
  <defs>
    <clipPath id="card-clip-dark">
      <rect x="0.5" y="0.5" width="879" height="183" rx="12" />
    </clipPath>
    <linearGradient id="bg-grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#131922" />
    </linearGradient>
    <radialGradient id="glow-dark" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#1f6feb" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-line-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#3fb950" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <rect x="0" y="0" width="880" height="184" fill="url(#bg-grad-dark)" />
    <rect x="0" y="0" width="880" height="184" fill="url(#glow-dark)" />

    <!-- Subtle top accent bar -->
    <rect x="0" y="0" width="880" height="2" fill="url(#accent-line-dark)" />

    <!-- Subtle engineering grid on right -->
    <g stroke="#30363d" stroke-width="1" opacity="0.35">
      <line x1="650" y1="0" x2="650" y2="184" />
      <line x1="700" y1="0" x2="700" y2="184" />
      <line x1="750" y1="0" x2="750" y2="184" />
      <line x1="800" y1="0" x2="800" y2="184" />
      <line x1="850" y1="0" x2="850" y2="184" />
      <line x1="610" y1="42" x2="880" y2="42" />
      <line x1="610" y1="92" x2="880" y2="92" />
      <line x1="610" y1="142" x2="880" y2="142" />
    </g>

    <!-- Minimal node-link motif -->
    <g fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.45">
      <path d="M 650 142 L 700 142 L 750 92 L 800 92 L 850 42" />
      <path d="M 700 92 L 750 42 L 800 42" stroke="#3fb950" opacity="0.7" />
    </g>
    <g>
      <circle cx="650" cy="142" r="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" opacity="0.7" />
      <circle cx="700" cy="142" r="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" opacity="0.7" />
      <circle cx="750" cy="92" r="3.5" fill="#58a6ff" opacity="0.75" />
      <circle cx="800" cy="92" r="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" opacity="0.7" />
      <circle cx="850" cy="42" r="3" fill="#58a6ff" opacity="0.8" />
      <circle cx="700" cy="92" r="3" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" opacity="0.65" />
      <circle cx="750" cy="42" r="3" fill="#3fb950" opacity="0.65" />
    </g>

    <!-- Eyebrow -->
    <circle cx="40" cy="43" r="4" fill="#3fb950" />
    <text x="54" y="47" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">
      POLITECHNIKA KRAKOWSKA  ·  INFORMATYKA STOSOWANA  ·  2. ROK
    </text>

    <!-- Title -->
    <text x="36" y="93" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.5">
      Adam
      <tspan fill="#58a6ff" font-weight="400"> / </tspan>
      <tspan fill="#c9d1d9" font-size="24" font-weight="500">Software Engineering</tspan>
    </text>

    <!-- Description -->
    <text x="36" y="126" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      Od systemów wbudowanych (C++, ATmega/ESP) i warstwy systemowej Linuksa (Python, X11)
    </text>
    <text x="36" y="148" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      po aplikacje webowe (TypeScript, React) oraz backend w .NET.
    </text>
  </g>

  <rect x="0.5" y="0.5" width="879" height="183" rx="12" fill="none" stroke="#30363d" stroke-width="1" />
</svg>
