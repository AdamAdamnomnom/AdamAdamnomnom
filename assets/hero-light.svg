<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" role="img" aria-label="Adam — Software Engineering">
  <defs>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="879" height="183" rx="12" />
    </clipPath>
    <linearGradient id="bg-grad-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <radialGradient id="glow-light" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#0969da" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-line-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#1a7f37" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#d0d7de" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect x="0" y="0" width="880" height="184" fill="url(#bg-grad-light)" />
    <rect x="0" y="0" width="880" height="184" fill="url(#glow-light)" />

    <rect x="0" y="0" width="880" height="2" fill="url(#accent-line-light)" />

    <g stroke="#d0d7de" stroke-width="1" opacity="0.6">
      <line x1="650" y1="0" x2="650" y2="184" />
      <line x1="700" y1="0" x2="700" y2="184" />
      <line x1="750" y1="0" x2="750" y2="184" />
      <line x1="800" y1="0" x2="800" y2="184" />
      <line x1="850" y1="0" x2="850" y2="184" />
      <line x1="610" y1="42" x2="880" y2="42" />
      <line x1="610" y1="92" x2="880" y2="92" />
      <line x1="610" y1="142" x2="880" y2="142" />
    </g>

    <g fill="none" stroke="#0969da" stroke-width="1.5" opacity="0.45">
      <path d="M 650 142 L 700 142 L 750 92 L 800 92 L 850 42" />
      <path d="M 700 92 L 750 42 L 800 42" stroke="#1a7f37" opacity="0.65" />
    </g>
    <g>
      <circle cx="650" cy="142" r="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5" opacity="0.75" />
      <circle cx="700" cy="142" r="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5" opacity="0.75" />
      <circle cx="750" cy="92" r="3.5" fill="#0969da" opacity="0.75" />
      <circle cx="800" cy="92" r="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5" opacity="0.75" />
      <circle cx="850" cy="42" r="3" fill="#0969da" opacity="0.8" />
      <circle cx="700" cy="92" r="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" opacity="0.65" />
      <circle cx="750" cy="42" r="3" fill="#1a7f37" opacity="0.65" />
    </g>

    <circle cx="40" cy="43" r="4" fill="#1a7f37" />
    <text x="54" y="47" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">
      POLITECHNIKA KRAKOWSKA  ·  INFORMATYKA STOSOWANA  ·  2. ROK
    </text>

    <text x="36" y="93" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.5">
      Adam
      <tspan fill="#0969da" font-weight="400"> / </tspan>
      <tspan fill="#57606a" font-size="24" font-weight="500">Software Engineering</tspan>
    </text>

    <text x="36" y="126" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      Od systemów wbudowanych (C++, ATmega/ESP) i warstwy systemowej Linuksa (Python, X11)
    </text>
    <text x="36" y="148" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      po aplikacje webowe (TypeScript, React) oraz backend w .NET.
    </text>
  </g>

  <rect x="0.5" y="0.5" width="879" height="183" rx="12" fill="none" stroke="#d0d7de" stroke-width="1" />
</svg>
